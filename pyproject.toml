[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "discover-anything"
version = "0.2.0"
description = "Find what's hiding in public data with an AI agent, then try hard to prove yourself wrong."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["citizen-science", "agent-skills", "mcp", "astronomy", "reproducibility", "claude-code"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "numpy>=2.0",
    "astropy>=6.0",
    "scipy>=1.11",
]

[project.optional-dependencies]
mcp = ["mcp>=1.2"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "mcp>=1.2"]

[project.scripts]
discover = "discover_anything.cli:main"

[project.urls]
Homepage = "https://github.com/karangupta8/discover-anything"
Issues = "https://github.com/karangupta8/discover-anything/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/discover_anything"]

[tool.hatch.build.targets.wheel.force-include]
"skills" = "discover_anything/_skills"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
